
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repository Explorer</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 35px 20px;
    font-family: Arial, sans-serif;
    background: #10131c;
    color: #f1f3f9;
}

.container {
    max-width: 950px;
    margin: auto;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #9ca5b8;
    margin-bottom: 25px;
}

.top {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 1px solid #30384a;
    border-radius: 9px;
    background: #191f2d;
    color: white;
    font-size: 15px;
}

button {
    padding: 12px 18px;
    border: 0;
    border-radius: 9px;
    background: #526bea;
    color: white;
    cursor: pointer;
}

.info {
    color: #9ca5b8;
    margin-bottom: 13px;
    font-size: 14px;
}

.file {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px;
    margin-bottom: 9px;
    background: #191f2d;
    border: 1px solid #2b3446;
    border-radius: 10px;
    color: white;
    text-decoration: none;
    transition: .15s;
}

.file:hover {
    background: #252e41;
    border-color: #657cf5;
    transform: translateY(-1px);
}

.icon {
    font-size: 24px;
}

.details {
    flex: 1;
    min-width: 0;
}

.filename {
    font-weight: bold;
    overflow-wrap: anywhere;
}

.path {
    color: #929db2;
    font-size: 12px;
    margin-top: 5px;
    overflow-wrap: anywhere;
}

.size {
    color: #9ca5b8;
    font-size: 12px;
    white-space: nowrap;
}

.empty {
    padding: 30px;
    color: #aab3c5;
    text-align: center;
}

@media(max-width: 500px) {
    .size { display: none; }
    h1 { font-size: 25px; }
}
</style>
</head>

<body>
<div class="container">

    <h1>📁 Repository Explorer</h1>
    <div class="subtitle">
        Alle Dateien und Ordner an einem Ort
    </div>

    <div class="top">
        <input
            id="search"
            type="text"
            placeholder="Dateien durchsuchen..."
        >
        <button onclick="loadFiles()">↻</button>
    </div>

    <div class="info" id="status">
        Repository wird geladen...
    </div>

    <div id="files"></div>

</div>

<script>
const OWNER = "arrowarena";
const REPO = "gggggggggg";

let allFiles = [];
let branch = "main";

function encodePath(path) {
    return path.split("/")
        .map(encodeURIComponent)
        .join("/");
}

function formatSize(bytes) {
    if (bytes === undefined) return "";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576)
        return (bytes / 1024).toFixed(1) + " KB";

    return (bytes / 1048576).toFixed(2) + " MB";
}

function getIcon(name) {
    const ext = name.split(".").pop().toLowerCase();

    const icons = {
        html: "🌐",
        css: "🎨",
        js: "⚙️",
        json: "📋",
        pdf: "📕",
        png: "🖼️",
        jpg: "🖼️",
        jpeg: "🖼️",
        gif: "🎞️",
        svg: "🖼️",
        mp4: "🎬",
        txt: "📄",
        md: "📝",
        zip: "📦"
    };

    return icons[ext] || "📄";
}

async function loadFiles() {
    const status = document.getElementById("status");
    const list = document.getElementById("files");

    status.textContent = "Dateien werden geladen...";
    list.replaceChildren();

    try {
        const headers = {
            Accept: "application/vnd.github+json"
        };

        const repoResponse = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}`,
            { headers }
        );

        if (!repoResponse.ok) {
            throw new Error("Repository nicht gefunden oder API-Limit erreicht.");
        }

        const repoData = await repoResponse.json();
        branch = repoData.default_branch;

        const treeResponse = await fetch(
            `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${encodeURIComponent(branch)}?recursive=1`,
            { headers }
        );

        if (!treeResponse.ok) {
            throw new Error("Dateiliste konnte nicht geladen werden.");
        }

        const tree = await treeResponse.json();

        allFiles = tree.tree
            .filter(item => item.type === "blob")
            .sort((a, b) => a.path.localeCompare(
                b.path, "de", { sensitivity: "base" }
            ));

        status.textContent =
            allFiles.length + " Dateien gefunden";

        if (tree.truncated) {
            status.textContent +=
                " – Hinweis: Die GitHub-Dateiliste wurde gekürzt.";
        }

        renderFiles();

    } catch (error) {
        status.textContent = "Fehler: " + error.message;
        list.textContent =
            "Überprüfe den Repository-Namen und deine Internetverbindung.";
    }
}

function renderFiles() {
    const list = document.getElementById("files");
    const search = document.getElementById("search")
        .value.toLowerCase().trim();

    list.replaceChildren();

    const filtered = allFiles.filter(file =>
        file.path.toLowerCase().includes(search)
    );

    document.getElementById("status").textContent =
        filtered.length + " von " + allFiles.length + " Dateien";

    if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Keine Dateien gefunden.";
        list.appendChild(empty);
        return;
    }

    filtered.forEach(file => {
        const name = file.path.split("/").pop();
        const folder = file.path.includes("/")
            ? file.path.substring(0, file.path.lastIndexOf("/"))
            : "Hauptverzeichnis";

        const link = document.createElement("a");
        link.className = "file";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        link.href =
            `https://github.com/${OWNER}/${REPO}/blob/` +
            encodePath(branch) + "/" + encodePath(file.path);

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = getIcon(name);

        const details = document.createElement("div");
        details.className = "details";

        const filename = document.createElement("div");
        filename.className = "filename";
        filename.textContent = name;

        const path = document.createElement("div");
        path.className = "path";
        path.textContent = folder;

        details.append(filename, path);

        const size = document.createElement("div");
        size.className = "size";
        size.textContent = formatSize(file.size);

        link.append(icon, details, size);
        list.appendChild(link);
    });
}

document.getElementById("search")
    .addEventListener("input", renderFiles);

loadFiles();
</script>

</body>
</html>

</body>
</html>
